const BOT_USERNAME = 'DKsAuction_bot';

const fmtWon = (n) => n == null ? '미상' : n.toLocaleString('ko-KR') + '원';
const fmtPct = (r) => r == null ? '' : Math.round(r * 100) + '%';

/* ---------- 관심물건 (브라우저 로컬 저장) ----------
   정적 사이트라 서버가 없다. 관심물건은 이 브라우저에만 저장되며 docid 기준이라
   매일 대시보드가 갱신돼도 유지된다. 시크릿 모드·다른 기기에서는 보이지 않는다. */
const FAV_KEY = 'auction2026:favorites';
let favorites = new Set();
try {
  favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
} catch (e) { favorites = new Set(); }

function saveFavorites() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); } catch (e) {}
}
function toggleFavorite(docid) {
  if (favorites.has(docid)) favorites.delete(docid); else favorites.add(docid);
  saveFavorites();
}

function ddayInfo(days) {
  if (days == null) return { label: '기일미정', cls: 'd-none' };
  if (days < 0) return { label: '기일경과', cls: 'd-none' };
  const label = days === 0 ? 'D-DAY' : `D-${days}`;
  if (days <= 1) return { label, cls: 'd-urgent' };
  if (days <= 3) return { label, cls: 'd-warn' };
  return { label, cls: 'd-ok' };
}

let state = { filter: 'all', condition: null, sort: 'sale_date', q: '' };

function buildConditionChips() {
  const row = document.getElementById('condition-chips');
  const all = document.createElement('div');
  all.className = 'chip active';
  all.textContent = '전체 조건';
  all.dataset.cond = '';
  row.appendChild(all);
  DATA.condition_names.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = name;
    chip.dataset.cond = name;
    row.appendChild(chip);
  });
  row.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    [...row.children].forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.condition = chip.dataset.cond || null;
    render();
  });
}

function updateStats(items) {
  document.getElementById('n-all').textContent = items.length;
  document.getElementById('n-new').textContent = items.filter(i => i.is_new_today).length;
  document.getElementById('n-changed').textContent = items.filter(i => i.is_changed_today).length;
  document.getElementById('n-urgent').textContent = items.filter(i => i.days_left != null && i.days_left >= 0 && i.days_left <= 3).length;
  document.getElementById('n-fav').textContent = items.filter(i => favorites.has(i.docid)).length;
}

function applyFilters() {
  let items = DATA.items;
  if (state.condition) items = items.filter(i => i.conditions.includes(state.condition));
  if (state.filter === 'new') items = items.filter(i => i.is_new_today);
  else if (state.filter === 'changed') items = items.filter(i => i.is_changed_today);
  else if (state.filter === 'urgent') items = items.filter(i => i.days_left != null && i.days_left >= 0 && i.days_left <= 3);
  else if (state.filter === 'fav') items = items.filter(i => favorites.has(i.docid));

  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase();
    items = items.filter(i =>
      i.case_no.toLowerCase().includes(q) ||
      (i.address || '').toLowerCase().includes(q) ||
      (i.building_name || '').toLowerCase().includes(q)
    );
  }

  items = [...items];
  if (state.sort === 'sale_date') {
    items.sort((a, b) => (a.sale_date || '9999').localeCompare(b.sale_date || '9999'));
  } else if (state.sort === 'price_asc') {
    items.sort((a, b) => (a.min_bid_amt ?? Infinity) - (b.min_bid_amt ?? Infinity));
  } else if (state.sort === 'failed_desc') {
    items.sort((a, b) => (b.failed_count ?? -1) - (a.failed_count ?? -1));
  } else if (state.sort === 'recent') {
    items.sort((a, b) => (b.first_seen_at || '').localeCompare(a.first_seen_at || ''));
  }
  return items;
}

function cardHTML(it) {
  const dd = ddayInfo(it.days_left);
  const floors = it.floors && it.floors.length ? it.floors.map(f => f + '층').join(',') : '층수미상';
  const evtTags = [];
  if (it.is_new_today) evtTags.push('<span class="tag evt-new">신규</span>');
  if (it.is_changed_today) evtTags.push('<span class="tag evt-changed">변경</span>');
  const condTags = it.conditions.map(c => `<span class="tag cond">${escapeHtml(c)}</span>`).join('');
  const faved = favorites.has(it.docid);
  return `
  <div class="card" data-docid="${escapeHtml(it.docid)}">
    <div class="card-top">
      <div><span class="case-no">${escapeHtml(it.case_no)}</span><span class="use-badge">${escapeHtml(it.use_name || '용도미상')} · ${escapeHtml(floors)}</span></div>
      <div class="card-actions">
        <span class="dday ${dd.cls}">${dd.label}</span>
        <button class="star ${faved ? 'on' : ''}" data-star="${escapeHtml(it.docid)}"
                aria-label="관심물건 ${faved ? '해제' : '등록'}" aria-pressed="${faved}">${faved ? '★' : '☆'}</button>
      </div>
    </div>
    <div class="addr">${escapeHtml(it.address)}${it.building_name ? ' · ' + escapeHtml(it.building_name) : ''}</div>
    <div class="price-row">
      <span class="amt">${fmtWon(it.appraisal_amt)}</span>
      <span class="arrow">→</span>
      <span class="amt">${fmtWon(it.min_bid_amt)}</span>
      ${it.min_bid_ratio != null ? `<span class="pct">${fmtPct(it.min_bid_ratio)}</span>` : ''}
    </div>
    <div class="meta-row">
      <span>유찰 ${it.failed_count ?? '?'}회</span>
      <span>${escapeHtml(it.sale_date || '매각기일 미정')}</span>
      <span>${escapeHtml(it.court_name || '')} ${escapeHtml(it.dept_name || '')}</span>
    </div>
    <div class="badge-row">${evtTags.join('')}${condTags}</div>
  </div>`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 상세 시트 ----------
   법원경매정보 상세화면은 SPA(WebSquare)라 외부에서 특정 물건으로 바로 갈 수 있는
   URL이 없다. 그래서 문서 버튼을 링크로 흉내내는 대신, 수집 단계에서 받아둔
   현황조사서·감정평가서 데이터를 여기서 직접 보여주고, 지도·토지이용계획처럼
   주소만으로 열 수 있는 외부 서비스만 링크로 연결한다. */
function externalLinks(it) {
  const q = encodeURIComponent(it.map_query || it.address || '');
  const links = [
    { ic: '🗺️', label: '네이버지도', url: `https://map.naver.com/p/search/${q}` },
    { ic: '📍', label: '카카오맵', url: `https://map.kakao.com/?q=${q}` },
    { ic: '🏞️', label: '토지이음', url: `https://www.eum.go.kr/web/am/amMain.jsp` },
    { ic: '📜', label: '인터넷등기소', url: 'https://www.iros.go.kr/' },
    { ic: '⚖️', label: '법원경매', url: 'https://www.courtauction.go.kr/' },
  ];
  return `<div class="linkgrid">${links.map(l =>
    `<a class="linkbtn" href="${l.url}" target="_blank" rel="noopener noreferrer">
       <span class="ic">${l.ic}</span><span>${l.label}</span></a>`).join('')}</div>`;
}

function occupantsSection(det) {
  if (!det) {
    return `<div class="note info">이 물건은 아직 상세정보를 수집하지 않았습니다.
      매각기일이 가까워지면(3주 이내) 자동으로 현황조사서·감정평가서 정보가 채워집니다.</div>`;
  }
  const occ = det.occupants || [];
  if (!occ.length) {
    return `<div class="note">현황조사서에 기재된 점유자 정보가 없습니다.
      점유자가 없다는 뜻이 아니라 조사 내용이 비어 있는 경우이므로, 반드시 법원의
      매각물건명세서 원본을 확인하세요.</div>`;
  }
  const rows = occ.map(o => `
    <tr>
      <td>${escapeHtml(o.detail_address || o.occupied_part || '-')}</td>
      <td class="mono">${escapeHtml(o.move_in_date || '-')}</td>
      <td>${escapeHtml(o.deposit || '-')}</td>
      <td>${escapeHtml(o.monthly_rent || '-')}</td>
      <td>${escapeHtml(o.fixed_date_note || '-')}</td>
    </tr>`).join('');
  return `
    <div class="occ-scroll">
      <table class="occ-table">
        <thead><tr><th>점유 부분</th><th>전입일</th><th>보증금</th><th>차임</th><th>확정일자</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="note" style="margin-top:8px">
      현황조사서 기준이며 보증금·차임은 비어 있는 경우가 많습니다. 대항력·인수 여부는
      <b>매각물건명세서와 등기부</b>로 확인해야 하며, 이 앱은 아직 권리분석을 하지 않습니다.
    </div>`;

  const appraisal = det && det.appraisal_no ? `
    <div class="sec">
      <div class="sec-label">감정평가서</div>
      <dl class="kv">
        <dt>평가서번호</dt><dd class="mono">${escapeHtml(det.appraisal_no)}</dd>
        <dt>감정평가사</dt><dd>${escapeHtml(det.appraiser_name || '-')}</dd>
        <dt>가격시점</dt><dd class="mono">${escapeHtml(fmtYmd(det.appraisal_base_date))}</dd>
        <dt>작성일</dt><dd class="mono">${escapeHtml(fmtYmd(det.appraisal_write_date))}</dd>
      </dl>
    </div>` : '';

  const related = det && det.related_cases && det.related_cases.length ? `
    <div class="sec">
      <div class="sec-label">관련 사건</div>
      <dl class="kv"><dt>중복·병합</dt><dd>${det.related_cases.map(escapeHtml).join('<br>')}</dd></dl>
    </div>` : '';

  const remark = it.remark ? `
    <div class="sec">
      <div class="sec-label">법원 비고</div>
      <div class="remark-box">${escapeHtml(it.remark)}</div>
    </div>` : '';

  return `
    <div class="sec">
      <button class="linkbtn" id="sheet-fav" style="width:100%;flex-direction:row;gap:8px;
        ${faved ? 'background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700' : ''}">
        <span class="ic">${faved ? '★' : '☆'}</span><span>${faved ? '관심물건 등록됨 (탭하여 해제)' : '관심물건으로 등록'}</span>
      </button>
    </div>

    <div class="sec">
      <div class="sec-label">가격</div>
      <dl class="kv">
        <dt>감정평가액</dt><dd class="mono">${fmtWon(it.appraisal_amt)}</dd>
        <dt>최저매각가</dt><dd class="mono">${fmtWon(it.min_bid_amt)} ${it.min_bid_ratio != null ? '('+fmtPct(it.min_bid_ratio)+')' : ''}</dd>
        <dt>유찰</dt><dd>${it.failed_count ?? '?'}회</dd>
      </dl>
    </div>

    <div class="sec">
      <div class="sec-label">기일 · 담당</div>
      <dl class="kv">
        <dt>매각기일</dt><dd class="mono">${escapeHtml(it.sale_date || '미정')}</dd>
        <dt>장소</dt><dd>${escapeHtml(it.sale_place || '-')}</dd>
        <dt>담당</dt><dd>${escapeHtml((it.court_name || '') + ' ' + (it.dept_name || ''))}</dd>
        <dt>연락처</dt><dd>${escapeHtml(it.tel || '-')}</dd>
      </dl>
    </div>

    <div class="sec">
      <div class="sec-label">물건</div>
      <dl class="kv">
        <dt>소재지</dt><dd>${escapeHtml(it.address)}</dd>
        <dt>용도</dt><dd>${escapeHtml(it.use_name || '-')}</dd>
        <dt>층</dt><dd>${escapeHtml(floors)}</dd>
        ${it.area_summary ? `<dt>면적</dt><dd>${escapeHtml(it.area_summary.replace(/\\r\\n/g, ' '))}</dd>` : ''}
        ${it.duplicate_case_no ? `<dt>중복사건</dt><dd>${escapeHtml(it.duplicate_case_no)}</dd>` : ''}
      </dl>
    </div>

    ${remark}

    <div class="sec">
      <div class="sec-label">현황조사서 · 점유자</div>
      ${occupantsSection(det)}
    </div>

    ${appraisal}
    ${related}

    <div class="sec">
      <div class="sec-label">매각물건명세서</div>
      <a class="reqbtn" href="https://t.me/${BOT_USERNAME}?start=pdf_${encodeURIComponent(it.docid)}"
         target="_blank" rel="noopener noreferrer">
        <span class="ic">📄</span>
        <span>명세서 원문 요청 <small>텔레그램으로 받기</small></span>
      </a>
      <div class="note info" style="margin-top:8px">
        누르면 텔레그램이 열립니다. 확인하면 <b>2~3분 뒤</b> 원문 PDF가 채팅으로 도착합니다.
        명세서는 매각기일 1주 전부터 공시되므로, 아직이면 봇이 그렇게 알려줍니다.
      </div>
    </div>

    <div class="sec">
      <div class="sec-label">바로가기</div>
      ${externalLinks(it)}
      <div class="note info" style="margin-top:8px">
        현황조사서 원본과 사건상세는 법원경매정보 사이트에서 사건번호
        <b>${escapeHtml(it.case_no)}</b>로 검색해야 합니다(외부 직접 링크가 지원되지 않습니다).
      </div>
    </div>`;
}

let sheetItem = null;

function openSheet(docid) {
  const it = DATA.items.find(i => i.docid === docid);
  if (!it) return;
  sheetItem = it;
  document.getElementById('sheet-case').textContent = it.case_no;
  document.getElementById('sheet-sub').textContent =
    `${it.use_name || '용도미상'} · ${it.address || ''}`;
  document.getElementById('sheet-body').innerHTML = sheetHTML(it);
  document.getElementById('sheet').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  bindSheetFav(it);
}

function bindSheetFav(it) {
  const b = document.getElementById('sheet-fav');
  if (b) b.addEventListener('click', () => {
    toggleFavorite(it.docid);
    document.getElementById('sheet-body').innerHTML = sheetHTML(it);
    bindSheetFav(it);
    render();
  });
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
  document.body.style.overflow = '';
  sheetItem = null;
}

function render() {
  const filtered = applyFilters();
  updateStats(DATA.items);
  document.getElementById('count-line').textContent = `${filtered.length}건 표시 중 (전체 ${DATA.items.length}건)`;
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    list.innerHTML = filtered.map(cardHTML).join('');
  }
  [...document.querySelectorAll('.stat')].forEach(el => {
    el.classList.toggle('active', el.dataset.filter === state.filter);
  });
}

document.getElementById('generated-at').textContent = '생성 ' + (DATA.generated_at || '').replace('T', ' ');

document.querySelectorAll('.stat').forEach(el => {
  el.addEventListener('click', () => {
    state.filter = state.filter === el.dataset.filter ? 'all' : el.dataset.filter;
    render();
  });
});
document.getElementById('search').addEventListener('input', (e) => { state.q = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });

// 카드: 별 버튼은 관심 토글, 그 외 영역은 상세 시트 열기 (이벤트 위임)
document.getElementById('list').addEventListener('click', (e) => {
  const star = e.target.closest('[data-star]');
  if (star) {
    e.stopPropagation();
    toggleFavorite(star.dataset.star);
    render();
    return;
  }
  const card = e.target.closest('.card');
  if (card && card.dataset.docid) openSheet(card.dataset.docid);
});

document.getElementById('sheet-close').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

buildConditionChips();
render();
</script>
